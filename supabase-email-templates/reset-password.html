<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your PulseTrack password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        &quot;Segoe UI&quot;,
        Roboto,
        sans-serif;
      color: #0f172a;
    "
  >
    <div style="margin: 0 auto; max-width: 600px; padding: 32px 20px 28px">
      <div style="margin-bottom: 16px">
        <span style="font-size: 22px; font-weight: 800; color: #0f172a"
          >PulseTrack</span
        >
      </div>

      <div
        style="
          border: 1px solid #e2e8f0;
          border-radius: 16px;
          background: #ffffff;
          padding: 28px;
          box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        "
      >
        <h1
          style="
            margin: 0;
            font-size: 26px;
            line-height: 1.2;
            letter-spacing: -0.02em;
          "
        >
          Reset your password
        </h1>
        <p
          style="
            margin: 12px 0 0;
            font-size: 15px;
            line-height: 1.7;
            color: #334155;
          "
        >
          We received a request to reset your PulseTrack password. Use the
          button below or enter your code manually.
        </p>

        <div
          style="
            margin-top: 22px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #f1f5f9;
            padding: 18px;
            text-align: center;
          "
        >
          <p
            style="
              margin: 0;
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.12em;
              color: #475569;
              font-weight: 700;
            "
          >
            Reset code
          </p>
          <p
            style="
              margin: 10px 0 0;
              font-size: 34px;
              letter-spacing: 0.2em;
              font-weight: 800;
              color: #0f172a;
            "
          >
            {{ .Token }}
          </p>
        </div>

        <div style="margin-top: 22px">
          <a
            href="{{ .SiteURL }}/reset-password?code={{ .Token }}&type=recovery"
            style="
              display: inline-block;
              border-radius: 10px;
              background: #0f172a;
              color: #ffffff;
              text-decoration: none;
              font-size: 15px;
              font-weight: 700;
              padding: 12px 18px;
            "
          >
            Reset Password
          </a>
        </div>

        <p
          style="
            margin: 18px 0 0;
            font-size: 13px;
            line-height: 1.6;
            color: #64748b;
          "
        >
          This link expires in 1 hour. If you did not request this, your
          password stays unchanged.
        </p>
      </div>
    </div>
  </body>
</html>
